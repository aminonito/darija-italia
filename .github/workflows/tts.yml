name: Voce darija (Gemini TTS)

on:
  push:
    branches: [main]
    paths: ["tts/jobs/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tts
  cancel-in-progress: false

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Genera audio
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/tts.py
      - name: Salva audio nella repository
        if: always()
        run: |
          git config user.name "darija-tts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tts/audio
          git diff --cached --quiet && exit 0
          git commit -m "Audio TTS generato"
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && exit 0; sleep 5; done
          exit 1
